name: Download and index public APSEC summaries
on:
  workflow_dispatch:
  schedule:
    - cron: '45 22 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/apsec.py'
      - 'scripts/build_index.py'
      - '.github/workflows/update-apsec.yml'
permissions:
  contents: write
concurrency:
  group: pdf-index-main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install requests beautifulsoup4 'PyMuPDF>=1.24,<2'
      - name: Download and validate all publicly listed summaries
        run: python scripts/apsec.py
      - name: Build page text, search index and verify every summary
        run: |
          python scripts/build_index.py
          python scripts/build_search.py build
          python scripts/build_retrieval.py
          python scripts/apsec.py verify
      - name: Commit validated archive and search results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config pack.window 0
          git config pack.depth 0
          git add documents/APSEC indexed_text index_manifest.json apsec search/pnap_fts.sqlite3 search/search_audit.json search/document_catalog.json search/topics
          if ! git diff --cached --quiet; then
            git commit -m 'Sync public APSEC summaries, provenance and page search index'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
