name: Cross-source search QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'indexed_text/**'
      - 'scripts/build_search.py'
      - 'scripts/test_cross_references.py'
      - 'scripts/retrieval.py'
      - 'scripts/build_retrieval.py'
      - 'scripts/test_retrieval.py'
      - 'scripts/materialize_qa_sources.py'
      - 'tests/**'
      - '.github/workflows/search-qa.yml'
concurrency:
  group: search-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  search-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'PyMuPDF>=1.24,<2'
      - name: Restore and check reviewed official source snapshots
        run: python scripts/materialize_qa_sources.py
      - name: Build index
        run: python scripts/build_search.py build
      - name: Check retrieval and statutory regressions
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Evaluate all original queries and rebuild fetchable topics
        run: |
          python scripts/test_cross_references.py --strict
          python scripts/build_retrieval.py
          python scripts/verify_geo.py
          python scripts/verify_bd_codes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-search-qa
          path: |
            search/qa_report.json
            search/official_source_check.json
            search/official_legislation_check.json
      - name: Publish validated sources and generated search results
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add documents/GEO/GEO_MANUALS search/pnap_fts.sqlite3 search/search_audit.json search/document_catalog.json search/topics search/qa_report.json geo/search_audit.json codes/search_audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified cross-source QA results and slope manual index'
            git push origin HEAD:"${TARGET_BRANCH}"
          fi
