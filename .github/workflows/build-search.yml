name: Build PNAP searchable index
on:
  workflow_dispatch:
  push:
    paths:
      - 'indexed_text/**'
      - 'index_manifest.json'
      - 'scripts/build_search.py'
      - 'scripts/build_retrieval.py'
      - '.github/workflows/build-search.yml'
  workflow_run:
    workflows: ["Index PDF documents"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: pnap-search-index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build page-level FTS5 index and audit
        run: python scripts/build_search.py build
      - name: Test Scheduled Area GI retrieval
        run: python scripts/build_search.py search "scheduled area GI" --limit 10
      - name: Build compact ChatGPT retrieval files
        run: python scripts/build_retrieval.py
      - name: Commit database and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search/pnap_fts.sqlite3 search/search_audit.json search/document_catalog.json search/topics/
          if ! git diff --cached --quiet; then
            git commit -m "Update PNAP full-text search index"
            git pull --rebase
            git push
          fi
