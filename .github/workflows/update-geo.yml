name: Download and index official GEO publications
on:
  workflow_dispatch:
  schedule:
    - cron: '45 22 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/geo.py'
      - 'scripts/verify_geo.py'
      - 'scripts/geo_ocr.py'
      - '.github/workflows/update-geo.yml'
permissions:
  contents: write
jobs:
  archive:
    concurrency:
      group: geo-archive-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 'PyMuPDF>=1.24,<2'
      - name: Download and validate official GEO PDFs
        run: python scripts/geo.py
      - name: Save source archive before OCR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config pack.window 0
          git config pack.depth 0
          git add documents/GEO geo/manifest.json geo/source_pages
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official GEO sources and provenance'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: OCR scanned GEO pages without model APIs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-tra
          python scripts/geo_ocr.py
      - name: Save completed OCR before rebuilding generated indexes
        run: |
          git add geo/ocr
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve hash-bound GEO OCR transcriptions'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  index:
    needs: archive
    concurrency:
      group: pdf-index-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 'PyMuPDF>=1.24,<2'
      - name: Rebuild generated indexes from current main and retry concurrent updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config pack.window 0
          git config pack.depth 0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_index.py
            python scripts/build_search.py build
            python scripts/build_retrieval.py
            python scripts/verify_geo.py
            python scripts/verify_bd_codes.py
            if [ -f explanatory/manifest.json ]; then
              python scripts/explanatory.py verify
            fi
            git add indexed_text index_manifest.json geo/search_audit.json codes/search_audit.json search/pnap_fts.sqlite3 search/search_audit.json search/document_catalog.json search/topics
            if [ -f explanatory/search_audit.json ]; then
              git add explanatory/search_audit.json
            fi
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Publish verified GEO and shared page search indexes'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Index publication failed after three rebuilt attempts' >&2
          exit 1
