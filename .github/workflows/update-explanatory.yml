name: Download and index HKIE and BD explanatory publications
on:
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/explanatory.py'
      - 'scripts/explanatory_ocr.py'
      - '.github/workflows/update-explanatory.yml'
permissions:
  contents: write
jobs:
  archive:
    concurrency:
      group: explanatory-archive-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF tools and check Python syntax
        run: |
          pip install requests beautifulsoup4 'PyMuPDF>=1.24,<2'
          python -m py_compile scripts/explanatory.py scripts/explanatory_ocr.py scripts/build_index.py
      - name: Refresh BD codes and discover public HKIE handbooks
        run: |
          python scripts/bd_codes.py
          python scripts/explanatory.py download
      - name: Save original PDFs and source catalogues
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config pack.window 0
          git config pack.depth 0
          git add documents/HKIE documents/BD_CODES codes/manifest.json codes/catalog.json explanatory
          if ! git diff --cached --quiet; then
            git commit -m 'Archive official public HKIE handbooks and BD explanation catalogue'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: OCR scanned HKIE pages without model APIs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-tra
          python scripts/explanatory_ocr.py
      - name: Save hash-bound OCR transcriptions
        run: |
          git add explanatory
          if ! git diff --cached --quiet; then
            git commit -m 'Add page-linked OCR transcriptions for HKIE handbooks'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  index:
    needs: archive
    concurrency:
      group: pdf-index-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 'PyMuPDF>=1.24,<2'
      - name: Build shared index and verify handbook and PNAP retrieval
        run: |
          python scripts/build_index.py
          python scripts/build_search.py build
          python scripts/build_retrieval.py
          python scripts/verify_bd_codes.py
          python scripts/explanatory.py verify
      - name: Save verified searchable text and audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config pack.window 0
          git config pack.depth 0
          git add indexed_text index_manifest.json explanatory/search_audit.json codes/search_audit.json search/pnap_fts.sqlite3 search/search_audit.json search/document_catalog.json search/topics
          if ! git diff --cached --quiet; then
            git commit -m 'Index HKIE and BD explanations with verified page retrieval'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
