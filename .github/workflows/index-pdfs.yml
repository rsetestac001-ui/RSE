name: Index PDF documents
on:
  push:
    paths:
      - 'documents/**'
      - 'scripts/build_index.py'
      - '.github/workflows/index-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pdf-index-main
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF extractor
        run: pip install 'PyMuPDF>=1.24,<2'
      - name: Extract text with page markers
        run: python scripts/build_index.py
      - name: Commit searchable text in small batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pack.window 0
          git config pack.depth 0
          mapfile -d '' files < <(git ls-files --others --modified --deleted --exclude-standard -z -- indexed_text index_manifest.json)
          batch_size=20
          for ((i=0; i<${#files[@]}; i+=batch_size)); do
            batch=("${files[@]:i:batch_size}")
            git add -- "${batch[@]}"
            if git diff --cached --quiet; then continue; fi
            git commit -m "Update searchable PDF text batch $((i/batch_size+1))"
            success=false
            for attempt in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git -c pack.window=0 -c pack.depth=0 push origin HEAD:main; then
                success=true
                break
              fi
              sleep $((attempt*10))
            done
            if [[ "$success" != true ]]; then
              echo "::error::Unable to upload indexed PDF text"
              exit 1
            fi
          done
