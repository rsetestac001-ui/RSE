name: Index PDF documents
on:
  push:
    paths:
      - 'documents/**'
      - 'scripts/build_index.py'
      - '.github/workflows/index-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF extractor
        run: pip install 'PyMuPDF>=1.24,<2'
      - name: Extract and audit
        run: python scripts/build_index.py
      - name: Commit updated searchable text
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indexed_text index_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update PDF text index"
            git push
          fi
