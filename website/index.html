const repo='https://github.com/rsetestac001-ui/RSE',raw='https://raw.githubusercontent.com/rsetestac001-ui/RSE/main/',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=null,selectedStage='verify',selectedSource='PNAP',sourceFilter='all';const n=x=>Number.isFinite(x)?x.toLocaleString():'未知';const link=(path,label=path)=>'<a href="'+repo+'/blob/main/'+path+'" target="_blank" rel="noopener">'+esc(label)+' ↗</a>',folder=(path,label)=>'<a href="'+repo+'/tree/main/'+path+'" target="_blank" rel="noopener">'+esc(label||path)+' ↗</a>';const labels={built:'已建立',review:'待覆核',pending:'待驗證',unknown:'未確認'};
function metric(value,label,note){return '<div class="metric"><label>'+label+'</label><strong>'+n(value)+'</strong><small>'+note+'</small></div>'}
function render(){let c=data.counts;$('#metrics').innerHTML=metric(c.pdf_files,'已存入 GitHub 嘅 PDF','檔案數量，唔代表所有官方文件已齊')+metric(c.indexed_pages,'全文索引頁數','由 search audit 讀取')+metric(c.pnap_sections,'PNAP 段落單元','包括有編號及未編號段落')+metric(c.law_provisions,'法例條文檔案','包括中英文版本');$('#content').className='';$('#content').innerHTML=`<section class="section" id="stage"><div class="heading"><div><div class="eyebrow">01 / PROJECT STAGE</div><h2>項目而家做到邊一步？</h2><p>${esc(data.stage_summary)}</p></div><span class="badge amber">按實際依據分階段顯示</span></div><div class="panel"><div class="stagegrid">${data.stages.map((s,i)=>`<button class="stage ${selectedStage===s.id?'active':''}" onclick="selectStage('${s.id}')" aria-pressed="${selectedStage===s.id}"><span class="num">STAGE 0${i+1}</span><span class="state-icon">${s.state==='built'?'✓':s.state==='review'?'◐':'○'}</span><h3>${esc(s.title)}</h3><span class="badge ${s.state==='review'||s.state==='pending'?'amber':''}">${esc(s.label)}</span></button>`).join('')}</div><div id="stageDetail">${stageDetail()}</div><div class="note">呢度顯示「做到邊一步」，唔會將文件入庫、搜尋命中同答案準確率混埋計成一個完成百分比。</div></div></section><section class="section" id="logic"><div class="heading"><div><div class="eyebrow">02 / HOW IT WORKS</div><h2>GitHub 係資料倉庫，亦係自動工場。</h2><p>官方文件入庫 → 整理文字 → 搜尋定位 → 回原文核對。</p></div></div><div class="columns"><div class="panel logic"><div class="eyebrow">DOCUMENT → EVIDENCE</div><h3>兩條入庫路徑，同一個目的。</h3><div class="branch"><div class="flowbox"><b>官方 PDF</b>直接抽字／掃描頁 OCR<br><small>保留 PDF 實體頁碼</small></div><div class="flowbox"><b>法例 XML</b>直接讀取及拆條文<br><small>保留章號、條文及版本</small></div></div><div class="unified"><b>文字 + manifest + 檢查報告</b>記錄來源、抽取狀態及缺漏</div><div class="down">↓</div><div class="unified"><b>頁級全文索引 / PNAP 段落 / 法例條文</b>用關鍵字找到候選文件及原文位置</div><div class="down">↓</div><div class="unified"><b>引用原文，核對條件與現行版本</b>文件名 + 條文／段落 + 頁碼 + 連結</div><div class="loop">↻ 發現漏文件、抽字或引用問題 → 修正資料／搜尋邏輯 → 再跑測試</div></div><div class="panel explain"><div class="item"><label>GITHUB 做咩</label><h3>儲存、留版本、自動跑程式。</h3><p>原始文件放喺 repository。GitHub Actions 執行 Python，抽文字、做 OCR、建立索引同檢查報告；每次改動都有紀錄。</p></div><div class="item"><label>搜尋點做</label><h3>先搵證據，再讀上下文。</h3><p>目前核心係 SQLite FTS5 關鍵字全文搜尋，加上 PNAP 段落同法例條文資料。搜尋唔會自動理解所有工程條件，無命中亦唔代表冇規定。</p></div><div class="item"><label>答案點先可信</label><h3>唔只睇摘要，要返原文。</h3><p>查 RSE GitHub 優先，再核對官方最新文件。數值、且／或條件、適用範圍、例外、修訂同交叉引用都要檢查；圖表、公式要回看 PDF。</p></div><div class="item"><label>依據放喺邊</label><p>${link('RSE_AI_RULES.md','回答及防漏規則')}<br>${link('scripts/build_search.py','全文搜尋程式')} · ${link('scripts/build_index.py','PDF 抽字程式')}</p></div></div></div></section><section class="section" id="data"><div class="heading"><div><div class="eyebrow">03 / REPOSITORY INVENTORY</div><h2>GitHub 入面，實際有啲咩？</h2><p>按來源查看文件數量、儲存位置同可搜尋粒度。點選一項睇詳情。</p></div></div><div class="panel"><div class="filters">${[['all','全部'],['pdf','PDF 文件'],['structured','段落／條文']].map(([id,t])=>`<button class="chip ${sourceFilter===id?'active':''}" onclick="filterSources('${id}')">${t}</button>`).join('')}</div><div class="inventory"><div id="bars" class="bars">${bars()}</div><div id="sourceDetail" class="source-detail">${sourceDetail()}</div></div><div class="coverage">文件數量按 GitHub 檔案計算；XML 條文同 PDF 分開顯示。已收錄 ≠ 官方收藏已齊，已抽文字 ≠ 所有章節已核實。${folder('documents/','查看原始文件目錄')}</div></div></section><section class="section"><div class="columns"><div class="panel tasks"><div class="eyebrow">OPEN ITEMS / 真實待辦</div><h3>而家要集中處理嘅地方</h3><div class="row"><span>抽字後仍需覆核嘅文件<br><span class="tiny">index_manifest 標示 needs_review</span></span><strong class="count">${n(c.needs_review)}</strong></div><div class="row"><span>索引內空白或未抽出文字嘅頁面<br><span class="tiny">可能係空白頁、掃描頁或圖表，須逐頁判斷</span></span><strong class="count">${n(c.empty_pages)}</strong></div><div class="row"><span>完整答案準確性<br><span class="tiny">現有證據不足以計算準確率</span></span><span class="badge gray">未知</span></div><div class="row"><span>官方版本、取代與歷年覆蓋</span><span class="badge amber">仍須核對</span></div><p class="tiny">${link('index_manifest.json','抽字紀錄')} · ${link('search/search_audit.json','搜尋檢查報告')}</p></div><div class="panel"><div class="eyebrow">NEXT / 下一步</div><h3>點樣繼續推進？</h3><ol class="work">${(data.notes.next_steps||[]).map(t=>'<li>'+esc(t)+'</li>').join('')}</ol><p class="tiny">${esc(data.notes.current_focus||'')}<br>${link('website/status-notes.json','查看／更新項目備註')}</p></div></div></section><section class="section" id="update"><div class="heading"><div><div class="eyebrow">04 / KEEP IT UP TO DATE</div><h2>網站同進度，全部有位更新。</h2><p>原始碼、進度備註同產生摘要嘅程式，都放喺同一個 RSE repository。</p></div></div><div class="updategrid"><div class="updatecard"><div class="icon">▤</div><h3>加文件／更新規範</h3><p>更新來源目錄或 documents，執行對應下載及索引工作流程。新文件先有可讀文字，先會進入搜尋。</p>${folder('documents/','documents/ 原始文件')}<a href="${repo}/actions" target="_blank" rel="noopener">GitHub Actions ↗</a></div><div class="updatecard"><div class="icon">◫</div><h3>更新項目進度</h3><p>數量由檔案及 audit 自動整理。要交代新階段、完成項目或待辦，就更新 status-notes.json。每次來源更新可重新產生摘要。</p>${link('website/status-notes.json','website/status-notes.json')}${link('scripts/build_project_overview.py','摘要產生程式')}</div><div class="updatecard"><div class="icon">⌘</div><h3>更新網站內容／介面</h3><p>改 website/index.html。Sites 正式網站會讀 GitHub 最新 project.json；改介面後，需要同步並重新發佈 Sites 版本。</p>${link('website/index.html','website/index.html')}${link('website/README.md','完整更新說明')}</div></div><div class="panel" style="margin-top:18px"><div class="heading"><div><h3>每次更新，點樣傳到呢度？</h3><p>打開網站或按「更新狀態」會重新讀取摘要；唔使搬成個搜尋庫。</p></div><a href="${repo}/actions/workflows/update-project-overview.yml" target="_blank" rel="noopener" class="tiny">產生最新摘要 ↗</a></div><ol class="work"><li><b>GitHub 資料／檢查報告有變</b> → overview workflow 按設定觸發。</li><li><b>Python 重算檔案數量同階段依據</b> → 寫入 <code>website/project.json</code>，保留 commit 紀錄。</li><li><b>網站讀取最新 project.json</b> → 更新資料數量、待覆核項目同進度備註。</li></ol><div class="note">如果只改網站介面，GitHub 保留原始碼，但唔會自行部署到 Sites；需要同步原始碼並發佈。執行中嘅索引未完成時，摘要可能仍然顯示上一輪檢查結果。</div></div><div class="panel" style="margin-top:18px"><div class="heading"><div><h3>GitHub 最近執行狀態</h3><p>按需要讀取公開 Actions 結果；執行成功唔等於工程答案已驗證。</p></div><button class="btn" id="activityBtn" onclick="loadActivity()">查看最新執行</button></div><div id="activity" class="activity muted">未讀取。${esc(data.workflows.length)} 個 workflow 定義載於摘要快照。</div></div></section><section class="section"><details><summary>點解唔用「整個項目完成咗幾多 %」？</summary><p>下載完成、抽字完成、可搜尋同答案準確係唔同嘅事。未定義完整文件範圍同驗證方法之前，單一百分比會誤導。呢個網站逐步列實際產物、待覆核數量同未確認事項。</p></details><details><summary>呢度嘅進度係點得出嚟？</summary><p>${esc(data.method)}<br>數據來源版本：${esc(data.source_commit||'未知')}。${link('website/project.json','查看完整摘要')}</p></details></section>`;$('#updated').textContent='摘要 '+new Date(data.generated_at).toLocaleString('zh-HK',{timeZone:'Asia/Hong_Kong'})+' HKT · '+(data.source_commit||'').slice(0,7);$('#connection').textContent='GitHub 項目摘要';if(location.hostname.endsWith('.chatgpt.site'))$('#legacyLink').innerHTML='<a href="/workbench">搜尋工作台 ↗</a>'}
function stageDetail(){let s=data.stages.find(x=>x.id===selectedStage)||data.stages[0];return '<div class="detail"><div><h3>'+esc(s.title)+'</h3><p>'+esc(s.detail)+'</p></div><div class="refs"><span class="tiny">GITHUB 依據</span>'+s.evidence.map(p=>p.endsWith('/')?folder(p,p):link(p)).join('')+'</div></div>'}
function selectStage(id){selectedStage=id;document.querySelectorAll('.stage').forEach((el,i)=>{let active=data.stages[i].id===id;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active))});$('#stageDetail').innerHTML=stageDetail()}
function sources(){return data.sources.filter(s=>sourceFilter==='all'||(sourceFilter==='pdf'?s.pdfs!==null:['PNAP','LAW'].includes(s.id)))}
function bars(){let ss=sources(),max=Math.max(1,...ss.map(s=>s.pdfs??s.texts));return ss.map(s=>'<button class="barrow '+(s.id===selectedSource?'active':'')+'" onclick="selectSource(\''+s.id+'\')" aria-label="查看 '+esc(s.title)+'"><span class="barname">'+esc(s.title)+'</span><span class="track"><span style="width:'+Math.max(1,(s.pdfs??s.texts)/max*100)+'%"></span></span><b>'+n(s.pdfs??s.texts)+'</b></button>').join('')+'<div class="tiny">圖表單位：PDF 檔案；Cap.123 系列以條文檔案計。</div>'}
function sourceDetail(){let s=data.sources.find(s=>s.id===selectedSource)||data.sources[0];return '<div class="eyebrow">'+esc(s.id)+' / '+esc(s.granularity)+'</div><h3>'+esc(s.title)+'</h3><span class="badge" style="align-self:start">'+esc(s.status)+'</span><div class="mini-stats"><div><strong>'+n(s.pdfs??s.texts)+'</strong><label>'+(s.pdfs===null?'條文 JSON 檔案':'PDF 檔案')+'</label></div><div><strong>'+n(s.texts)+'</strong><label>'+(s.pdfs===null?'可讀條文':'文字檔案')+'</label></div></div><p>'+esc(s.description)+'</p><div class="refs">'+folder(s.path,'查看 GitHub 資料目錄')+link(s.evidence,'查看檢查依據')+'</div>'}
function selectSource(id){selectedSource=id;$('#bars').innerHTML=bars();$('#sourceDetail').innerHTML=sourceDetail()}
function filterSources(f){sourceFilter=f;selectedSource=sources()[0]?.id||'PNAP';render()}
async function load(){let button=$('#refresh');button.disabled=true;$('#error').innerHTML='';try{let onSite=location.hostname.endsWith('.chatgpt.site')||['127.0.0.1','localhost'].includes(location.hostname),url=onSite?'/api/project':'./project.json';let res=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('讀取失敗 '+res.status);let incoming=await res.json();if(incoming.schema!==1||!Array.isArray(incoming.sources)||!Array.isArray(incoming.stages))throw Error('摘要格式不符');data=incoming;render();if(res.headers.get('X-Overview-Source')==='bundled'){$('#connection').textContent='已載入保存快照';$('#error').innerHTML='<div class="error">暫時未能讀取 GitHub 最新摘要，現顯示隨網站保存嘅快照；請留意摘要日期。</div>'}}catch(e){$('#connection').textContent='暫時未能更新';$('#error').innerHTML='<div class="error">未能讀取項目摘要。'+esc(e.message)+'，可按「更新狀態」重試。'+(data?' 現有畫面保留上一份摘要。':'')+'</div>'}finally{button.disabled=false}}
async function loadActivity(){let b=$('#activityBtn');b.disabled=true;try{let r=await fetch('https://api.github.com/repos/rsetestac001-ui/RSE/actions/runs?per_page=5');if(!r.ok)throw Error('API '+r.status);let d=await r.json(),map={success:'成功',failure:'失敗',cancelled:'已取消',skipped:'已略過',in_progress:'執行中',queued:'等候中',completed:'已完成'};$('#activity').innerHTML=(d.workflow_runs||[]).map(x=>'<a href="'+esc(x.html_url)+'" target="_blank" rel="noopener">'+esc(x.name)+' <span class="badge '+(x.conclusion==='failure'?'amber':'')+'">'+esc(map[x.conclusion||x.status]||x.status)+'</span><div class="tiny">'+new Date(x.updated_at).toLocaleString('zh-HK',{timeZone:'Asia/Hong_Kong'})+' HKT · '+esc(x.head_sha?.slice(0,7))+'</div></a>').join('')||'未有執行紀錄'}catch(e){$('#activity').textContent='暫時未能讀取最新執行結果。請直接到 GitHub Actions 查看。'}finally{b.disabled=false}}
$('#refresh').onclick=load;load();
</script></body></html>
